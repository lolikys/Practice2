{% extends "base.html" %}
{% block title %}Курсы студента {{ student.name }}{% endblock %}

{% block content %}
<h2>Курсы для {{ student.name }}</h2>
<form method="POST">
    <div class="form-group">
        <label>Доступные курсы:</label>
        {% for course in all_courses %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="courses" value="{{ course.id }}"
                       {% if course in student.courses %}checked{% endif %}>
                <label class="form-check-label">{{ course.title }}</label>
            </div>
        {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
{% endblock %}
