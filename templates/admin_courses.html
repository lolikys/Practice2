{% extends "base.html" %}
{% block title %}Управление курсами{% endblock %}

{% block content %}
<h2>Список курсов</h2>

<a href="{{ url_for('add_course_admin') }}" class="btn btn-success">Добавить курс</a>

<table class="table">
    <thead>
        <tr>
            <th>Название</th>
            <th>Длительность</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for course in courses %}
        <tr>
            <td>{{ course.title }}</td>
            <td>{{ course.duration }}</td>
            <td>
                <a href="{{ url_for('edit_course_admin', course_id=course.id) }}">Редактировать</a>
                <a href="{{ url_for('delete_course_admin', course_id=course.id) }}">Удалить</a>
                <a href="{{ url_for('enroll_student_to_course', course_id=course.id) }}">Зачислить студента</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
